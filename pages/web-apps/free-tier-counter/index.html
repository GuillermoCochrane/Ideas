<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker de capa gratuita</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📆</text></svg>">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a12;
    --bg-panel: rgba(15, 15, 26, 0.7);
    --cyan: #00f0ff;
    --amber: #ffb800;
    --red: #ff2b4a;
    --green: #00ff9d;
    --text: #c8d6e5;
    --text-dim: #6a7a8a;
    --border: rgba(0, 240, 255, 0.3);
    --border-strong: rgba(0, 240, 255, 0.7);
    --glow-sm: 0 0 6px rgba(0, 240, 255, 0.5);
    --glow-md: 0 0 12px rgba(0, 240, 255, 0.5), inset 0 0 8px rgba(0, 240, 255, 0.15);
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--mono);
    color: var(--text);
    background:
      linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px) 0 0 / 40px 40px,
      radial-gradient(circle at 50% 0%, rgba(255, 184, 0, 0.08), transparent 60%),
      var(--bg);
    height: 100vh;
    overflow: hidden;
    padding: 2rem 1rem;
    line-height: 1.5;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  main {
    max-width: 720px;
    height: 100%;
    margin: 0 auto;
    display: grid;
    gap: 1.5rem;
    grid-template-rows: auto auto auto 1fr;
  }

  /* ---------- Layout amplio: contador y form en la misma fila ---------- */
  @media (min-width: 700px) {
    main {
      max-width: 960px;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "contador form"
        "acciones acciones"
        "tabla    tabla";
      grid-template-rows: auto auto 1fr;
    }
    #seccion-contador { grid-area: contador; }
    #seccion-form     { grid-area: form; }
    .acciones         { grid-area: acciones; }
    #seccion-tabla    { grid-area: tabla; }
  }

  section {
    border: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 1.25rem;
    backdrop-filter: blur(2px);
  }

  h2 {
    margin: 0 0 1rem;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber);
    text-shadow: 0 0 6px rgba(255, 184, 0, 0.5);
  }

  /* ---------- Contador ---------- */
  #seccion-contador { text-align: center; }

  #seccion-contador p {
    margin: 0 0 0.75rem;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.5rem;
  }

  #contador {
    font-size: 3.5rem;
    font-weight: bold;
    color: var(--cyan);
    text-shadow: 0 0 14px var(--cyan), 0 0 30px rgba(0, 240, 255, 0.4);
    line-height: 1;
    letter-spacing: 0.05em;
  }

  #seccion-contador small {
    font-size: 1rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  meter {
    width: 100%;
    height: 1.4em;
    display: block;
    border: 1px solid var(--border);
    background: rgba(0, 240, 255, 0.03);
  }

  meter::-webkit-meter-bar {
    background: rgba(0, 240, 255, 0.05);
    border: none;
  }
  meter::-webkit-meter-optimum-value {
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    transition: width 250ms ease;
  }
  meter::-webkit-meter-suboptimum-value {
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber);
    transition: width 250ms ease;
  }
  meter::-webkit-meter-even-less-good-value {
    background: var(--red);
    box-shadow: 0 0 10px var(--red);
    transition: width 250ms ease;
  }
  meter::-moz-meter-bar { background: var(--cyan); }

  /* ---------- Formulario ---------- */
  form p {
    margin: 0 0 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  label {
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cyan);
  }

  input[type="time"] {
    font-family: var(--mono);
    font-size: 1rem;
    padding: 0.5rem 0.75rem;
    background: rgba(0, 240, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--cyan);
    color-scheme: dark;
    transition: box-shadow 150ms ease, border-color 150ms ease;
  }

  input[type="time"]:hover:not(:disabled) { border-color: var(--border-strong); }

  input[type="time"]:focus {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
    box-shadow: var(--glow-sm);
  }

  input[type="time"]:disabled { opacity: 0.4; cursor: not-allowed; }

  button {
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    cursor: pointer;
    transition:
      box-shadow 150ms ease,
      background-color 150ms ease,
      color 150ms ease,
      border-color 150ms ease,
      text-shadow 150ms ease;
  }

  button:hover:not(:disabled),
  button:focus-visible:not(:disabled) {
    box-shadow: var(--glow-md);
    text-shadow: 0 0 6px var(--cyan);
    border-color: var(--border-strong);
  }

  button:active:not(:disabled) {
    background: var(--cyan);
    color: var(--bg);
    text-shadow: none;
    box-shadow: 0 0 16px var(--cyan);
  }

  button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    border-color: var(--text-dim);
    color: var(--text-dim);
  }

  #btn-cancelar {
    border-color: var(--amber);
    color: var(--amber);
  }

  #btn-cancelar:hover:not(:disabled),
  #btn-cancelar:focus-visible:not(:disabled) {
    box-shadow: 0 0 12px rgba(255, 184, 0, 0.5), inset 0 0 8px rgba(255, 184, 0, 0.15);
    text-shadow: 0 0 6px var(--amber);
    border-color: var(--amber);
  }

  #editando-info {
    margin: 0 0 0.75rem;
    color: var(--amber);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-shadow: 0 0 6px rgba(255, 184, 0, 0.5);
  }

  #form-error {
    margin: 0.5rem 0 0;
    color: var(--red);
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }

  #form-finalizada {
    margin: 0.5rem 0 0;
    color: var(--amber);
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(255, 184, 0, 0.5);
    text-align: center;
  }

  /* ---------- Acciones (toolbar) ---------- */
  .acciones {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .acciones #btn-reiniciar {
    margin-left: auto;
  }

  /* ---------- Tabla ---------- */
  #seccion-tabla {
    min-height: 0;
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
  }

  th, td {
    padding: 0.6rem 0.8rem;
    text-align: left;
    border: 1px solid var(--border);
    transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
  }

  th {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber);
    text-shadow: 0 0 4px rgba(255, 184, 0, 0.3);
    background: rgba(255, 184, 0, 0.04);
  }

  th:first-child, td:first-child {
    width: 3rem;
    text-align: center;
    color: var(--text-dim);
  }

  td:last-child {
    width: 7rem;
    text-align: right;
    white-space: nowrap;
  }

  tbody tr:hover { background: rgba(0, 240, 255, 0.06); }

  tbody tr:hover td {
    border-color: var(--border-strong);
    box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.12);
  }

  tbody tr:hover td:first-child {
    box-shadow: inset 3px 0 0 var(--cyan), inset 0 0 8px rgba(0, 240, 255, 0.12);
  }

  tbody tr.nueva { animation: fadeIn 150ms ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  td button {
    padding: 0.25rem 0.6rem;
    font-size: 0.9rem;
    margin-left: 0.25rem;
  }

  td button.peligro {
    border-color: var(--red);
    color: var(--red);
  }

  td button.peligro:hover:not(:disabled),
  td button.peligro:focus-visible:not(:disabled) {
    box-shadow: 0 0 12px rgba(255, 43, 74, 0.5), inset 0 0 8px rgba(255, 43, 74, 0.15);
    text-shadow: 0 0 6px var(--red);
    border-color: var(--red);
  }

  #tabla-vacia {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0;
    padding: 1rem;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 480px) {
    body { padding: 1rem 0.5rem; }
    section { padding: 1rem; }
    #contador { font-size: 2.5rem; }
    form p { flex-direction: column; align-items: stretch; }
    label { text-align: left; }
    td:last-child { width: 5.5rem; }
    td button { padding: 0.25rem 0.45rem; }
    .acciones { justify-content: center; }
    .acciones #btn-reiniciar { margin-left: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main>
  <h1 class="sr-only" id="titulo-app">Tracker de capa gratuita</h1>

  <section id="seccion-contador" aria-labelledby="contador-titulo">
    <h2 id="contador-titulo">Usos disponibles</h2>
    <p>
      <output id="contador" aria-live="polite">56</output>
      <small>de 56</small>
    </p>
    <meter id="meter" min="0" max="56" low="10" high="40" optimum="56" value="56"
           aria-label="Usos disponibles"></meter>
  </section>

  <section id="seccion-form" aria-labelledby="form-titulo">
    <h2 id="form-titulo">Registrar uso</h2>
    <p id="editando-info" hidden></p>
    <form id="form" novalidate>
      <p>
        <label for="hora">Hora</label>
        <input type="time" id="hora" name="hora" required autocomplete="off">
      </p>
      <p>
        <button type="submit" id="btn-submit">Agregar</button>
        <button type="button" id="btn-cancelar" hidden>Cancelar</button>
      </p>
      <p id="form-error" role="alert" hidden></p>
    </form>
    <p id="form-finalizada" role="status" hidden>Capa gratis finalizada</p>
  </section>

  <section class="acciones" role="toolbar" aria-label="Acciones de datos" aria-orientation="horizontal">
    <button type="button" id="btn-exportar">Exportar</button>
    <button type="button" id="btn-importar">Importar</button>
    <button type="button" id="btn-reiniciar">Reiniciar</button>
    <input type="file" id="archivo" accept="application/json,.json" hidden>
  </section>

  <section id="seccion-tabla" aria-labelledby="titulo-app">
    <table id="tabla">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Hora</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p id="tabla-vacia">Sin registros todavía.</p>
  </section>
</main>

<script>
(function () {
  'use strict';

  const MAX = 56;
  const STORAGE_KEY = 'capaGratis.v1';
  const HORA_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

  const $ = (id) => document.getElementById(id);
  const contadorEl     = $('contador');
  const meterEl        = $('meter');
  const form           = $('form');
  const inputHora      = $('hora');
  const btnSubmit      = $('btn-submit');
  const btnCancelar    = $('btn-cancelar');
  const formError      = $('form-error');
  const formFinalizada = $('form-finalizada');
  const editandoInfo   = $('editando-info');
  const tbody          = $('tbody');
  const tablaVacia     = $('tabla-vacia');
  const btnExportar    = $('btn-exportar');
  const btnImportar    = $('btn-importar');
  const btnReiniciar   = $('btn-reiniciar');
  const archivoInput   = $('archivo');

  // Única fuente de verdad. El contador se DERIVA: MAX - filas.length
  let filas = [];
  let editando = null;

  // ---------- Persistencia ----------
  function cargar() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      const validadas = validarFilas(data && data.filas);
      if (validadas) filas = validadas;
    } catch (_) { /* corrupto: arrancamos limpio */ }
  }

  function guardar() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ filas }));
    } catch (_) { /* modo privado / cuota: ignoramos */ }
  }

  function validarFilas(data) {
    if (!Array.isArray(data)) return null;
    const out = [];
    for (const item of data) {
      if (!item || typeof item.hora !== 'string' || !HORA_RE.test(item.hora)) return null;
      out.push({ hora: item.hora });
    }
    return out;
  }

  // ---------- Mensajes ----------
  function mostrarError(msg) {
    formError.hidden = false;
    formError.textContent = msg;
  }
  function limpiarError() {
    formError.hidden = true;
    formError.textContent = '';
  }

  // ---------- Render ----------
  function render(nuevaIdx = null) {
    const disponibles = MAX - filas.length;

    contadorEl.textContent = String(disponibles);
    meterEl.value = disponibles;
    meterEl.setAttribute('aria-valuetext', `${disponibles} de ${MAX} usos disponibles`);

    const sinCupo = disponibles <= 0;
    const bloqueado = sinCupo && editando === null;
    inputHora.disabled    = bloqueado;
    btnSubmit.disabled    = bloqueado;
    btnCancelar.disabled  = bloqueado;
    formFinalizada.hidden = !bloqueado;

    tbody.textContent = '';
    filas.forEach((fila, i) => {
      const tr = document.createElement('tr');
      if (i === nuevaIdx) tr.classList.add('nueva');

      const tdIdx = document.createElement('td');
      tdIdx.textContent = String(i + 1);

      const tdHora = document.createElement('td');
      tdHora.textContent = fila.hora;

      const tdAcc = document.createElement('td');

      const btnEditar = document.createElement('button');
      btnEditar.type = 'button';
      btnEditar.textContent = '✎';
      btnEditar.setAttribute('aria-label', `Editar fila ${i + 1}`);
      btnEditar.addEventListener('click', () => iniciarEdicion(i));

      const btnEliminar = document.createElement('button');
      btnEliminar.type = 'button';
      btnEliminar.className = 'peligro';
      btnEliminar.textContent = '×';
      btnEliminar.setAttribute('aria-label', `Eliminar fila ${i + 1}`);
      btnEliminar.addEventListener('click', () => eliminarFila(i));

      tdAcc.append(btnEditar, btnEliminar);
      tr.append(tdIdx, tdHora, tdAcc);
      tbody.appendChild(tr);
    });

    tablaVacia.hidden = filas.length > 0;

    if (editando !== null) {
      editandoInfo.hidden = false;
      editandoInfo.textContent = `Editando fila #${editando + 1}`;
    } else {
      editandoInfo.hidden = true;
      editandoInfo.textContent = '';
    }
  }

  // ---------- Edición ----------
  function iniciarEdicion(idx) {
    editando = idx;
    inputHora.value = filas[idx].hora;
    btnSubmit.textContent = 'Guardar cambios';
    btnCancelar.hidden = false;
    limpiarError();
    render();
    inputHora.focus();
  }

  function cancelarEdicion() {
    editando = null;
    inputHora.value = '';
    btnSubmit.textContent = 'Agregar';
    btnCancelar.hidden = true;
    limpiarError();
    render();
    inputHora.focus();
  }

  // ---------- Acciones ----------
  function eliminarFila(idx) {
    if (editando === idx) {
      editando = null;
      inputHora.value = '';
      btnSubmit.textContent = 'Agregar';
      btnCancelar.hidden = true;
    } else if (editando !== null && editando > idx) {
      editando -= 1;
    }
    filas.splice(idx, 1);
    guardar();
    limpiarError();
    render();
  }

  function enviarFormulario(e) {
    e.preventDefault();
    limpiarError();

    const valor = inputHora.value;
    if (!valor || !HORA_RE.test(valor)) {
      mostrarError('Ingresá una hora válida (HH:MM).');
      inputHora.focus();
      return;
    }

    if (editando !== null) {
      filas[editando].hora = valor;
      editando = null;
      inputHora.value = '';
      btnSubmit.textContent = 'Agregar';
      btnCancelar.hidden = true;
      guardar();
      render();
      inputHora.focus();
      return;
    }

    if (MAX - filas.length <= 0) {
      mostrarError('No quedan usos disponibles.');
      return;
    }
    filas.push({ hora: valor });
    guardar();
    const nuevaIdx = filas.length - 1;
    inputHora.value = '';
    render(nuevaIdx);
    inputHora.focus();
  }

  // ---------- Export / Import ----------
  function exportar() {
    const data = JSON.stringify({ filas }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `capa-gratis-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  function importarArchivo(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        const candidatas = validarFilas(Array.isArray(data) ? data : data.filas);
        if (!candidatas) {
          mostrarError('El archivo no tiene un formato válido.');
          return;
        }
        if (candidatas.length > MAX) {
          mostrarError(`El archivo tiene ${candidatas.length} filas; el máximo es ${MAX}.`);
          return;
        }
        const ok = confirm(
          `Se reemplazarán los registros actuales (${filas.length}) ` +
          `por los del archivo (${candidatas.length}). ¿Continuar?`
        );
        if (!ok) return;
        filas = candidatas;
        editando = null;
        inputHora.value = '';
        btnSubmit.textContent = 'Agregar';
        btnCancelar.hidden = true;
        limpiarError();
        guardar();
        render();
      } catch (_) {
        mostrarError('No se pudo leer el archivo.');
      }
    };
    reader.onerror = () => mostrarError('No se pudo leer el archivo.');
    reader.readAsText(file);
  }

  // ---------- Reset ----------
  function reiniciar() {
    const ok = confirm('Se borrarán todos los registros y el contador volverá a 56. ¿Continuar?');
    if (!ok) return;
    filas = [];
    editando = null;
    inputHora.value = '';
    btnSubmit.textContent = 'Agregar';
    btnCancelar.hidden = true;
    limpiarError();
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    render();
    inputHora.focus();
  }

  // ---------- Eventos ----------
  form.addEventListener('submit', enviarFormulario);
  btnCancelar.addEventListener('click', cancelarEdicion);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && editando !== null) cancelarEdicion();
  });

  btnExportar.addEventListener('click', exportar);
  btnImportar.addEventListener('click', () => archivoInput.click());
  archivoInput.addEventListener('change', () => {
    const file = archivoInput.files && archivoInput.files[0];
    if (file) importarArchivo(file);
    archivoInput.value = '';
  });
  btnReiniciar.addEventListener('click', reiniciar);

  // ---------- Inicio ----------
  cargar();
  render();
})();
</script>
</body>
</html>
